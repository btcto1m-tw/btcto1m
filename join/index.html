<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://t.me/acssun_bot">
<title>加入 BTCto1M Telegram 頻道</title>
<link rel="canonical" href="https://t.me/acssun_bot">
<style>
  :root { --gold:#C9A24B; --gold-deep:#B8860B; --ink:#1a1a1a; --sub:#5f5f5f; --line:#ececec; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background:#fff; color:var(--ink); line-height:1.7;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 22px;
  }
  .card { width:100%; max-width:420px; text-align:center; }
  .logo { width:96px; height:96px; border-radius:20px; object-fit:cover;
    border:1px solid var(--line); box-shadow:0 6px 22px rgba(201,162,75,.20); }
  h1 { margin-top:20px; font-size:1.35rem; font-weight:700; letter-spacing:.3px; }
  h1 span { color:var(--gold-deep); }
  p.lead { margin-top:10px; color:var(--sub); font-size:.98rem; }
  ul { list-style:none; margin:22px 0 26px; text-align:left; display:grid; gap:10px; }
  li { position:relative; padding-left:20px; color:#333; font-size:.96rem; }
  li::before { content:""; position:absolute; left:0; top:11px; width:8px; height:8px;
    border-radius:50%; background:var(--gold); }
  .btn { display:block; background:var(--gold-deep); color:#fff; text-decoration:none;
    font-weight:700; font-size:1.05rem; padding:16px 20px; border-radius:14px;
    box-shadow:0 6px 18px rgba(184,134,11,.28); }
  .url { margin-top:12px; color:#999; font-size:.85rem; word-break:break-all; }
  footer { margin-top:30px; color:#aaa; font-size:.78rem; }
  footer a { color:#aaa; }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="BTCto1M" width="96" height="96">
    <h1>加入 <span>BTCto1M</span> Telegram 頻道</h1>
    <p class="lead">正在把你帶過去…沒有自動跳轉的話，按下面。</p>
    <ul>
      <li>我自己在用的進場訊號，開倉當下就發</li>
      <li>置頂貼文有每一期的筆記與清單</li>
      <li>免費，不用留言、不用私訊</li>

    <a class="btn" href="https://t.me/acssun_bot" rel="noopener">前往 Telegram 頻道 →</a>
    <p class="url">t.me/acssun_bot</p>
    <footer>© 2026 <a href="https://btcto1m.com">BTCto1M LLC</a></footer>
