<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c66236"/>
      <stop offset="1" stop-color="#a4471f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#5a2410" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 簿本 -->
  <g filter="url(#sh)">
    <rect x="238" y="196" width="548" height="632" rx="56" fill="#fbf7f0"/>
    <!-- 左側裝訂邊 -->
    <path d="M238 252a56 56 0 0 1 56-56h58v632h-58a56 56 0 0 1-56-56z" fill="#e8ded0"/>
    <circle cx="295" cy="330" r="17" fill="#c9bba7"/>
    <circle cx="295" cy="512" r="17" fill="#c9bba7"/>
    <circle cx="295" cy="694" r="17" fill="#c9bba7"/>
  </g>

  <!-- 訂單條目 -->
  <g fill="#d9cdba">
    <rect x="420" y="300" width="290" height="34" rx="17"/>
    <rect x="420" y="404" width="290" height="34" rx="17"/>
    <rect x="420" y="508" width="180" height="34" rx="17"/>
  </g>

  <!-- 已取貨勾勾 -->
  <circle cx="672" cy="700" r="132" fill="#2e7d4f"/>
  <path d="M604 700l46 48 92-102" fill="none" stroke="#fff" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
